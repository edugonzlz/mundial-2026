name: Update World Cup Data
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download teams
        run: curl -sSfL --connect-timeout 15 --max-time 45 --retry 5 --retry-delay 15 --retry-all-errors -o data/teams.json https://worldcup26.ir/get/teams
      - name: Download groups
        run: curl -sSfL --connect-timeout 15 --max-time 45 --retry 5 --retry-delay 15 --retry-all-errors -o data/groups.json https://worldcup26.ir/get/groups
      - name: Download games
        run: curl -sSfL --connect-timeout 15 --max-time 45 --retry 5 --retry-delay 15 --retry-all-errors -o data/games.json https://worldcup26.ir/get/games
      - name: Download stadiums
        run: curl -sSfL --connect-timeout 15 --max-time 45 --retry 5 --retry-delay 15 --retry-all-errors -o data/stadiums.json https://worldcup26.ir/get/stadiums
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar datos [skip ci]"
            git push
          fi
