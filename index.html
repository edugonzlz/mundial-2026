<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0f1117;color:#e4e6eb;min-height:100vh}
header{background:linear-gradient(135deg,#1a1d29,#0f1117);border-bottom:2px solid #2a2d3a;padding:1.5rem 2rem;text-align:center;position:sticky;top:0;z-index:100}
header h1{font-size:2rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#f7c948,#f0a500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header h1 span{font-weight:300;-webkit-text-fill-color:#e4e6eb}
header p{color:#7a7f93;font-size:.85rem;margin-top:4px}
.tabs{display:flex;justify-content:center;margin-top:1rem;border-bottom:1px solid #2a2d3a;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;border:none;color:#7a7f93;padding:.75rem 1.5rem;font-size:.9rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:#e4e6eb}
.tab-btn.active{color:#f0a500;border-bottom-color:#f0a500}
.container{max-width:1400px;margin:0 auto;padding:1.5rem}
.tab-content{display:none}
.tab-content.active{display:block}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}
.group-card{border-radius:12px;overflow:hidden;background:#1a1d29;border:1px solid #2a2d3a;transition:transform .15s}
.group-card:hover{transform:translateY(-2px)}
.group-card .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.group-header{padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:1.1rem;letter-spacing:1px}
.group-standings{width:100%;border-collapse:collapse;font-size:.82rem}
.group-standings th{padding:.5rem .4rem;text-align:center;font-size:.7rem;text-transform:uppercase;color:#7a7f93;font-weight:600;border-bottom:1px solid #2a2d3a;background:#141720}
.group-standings th:first-child{text-align:left;padding-left:.75rem}
.group-standings td{padding:.5rem .4rem;text-align:center;border-bottom:1px solid #2a2d3a;white-space:nowrap}
.group-standings tr:last-child td{border-bottom:none}
.group-standings td:first-child{text-align:left;padding-left:.75rem}
.rank-num{display:inline-block;width:18px;text-align:center;font-weight:700;font-size:.75rem;color:#7a7f93}
.team-cell{cursor:pointer;display:flex;align-items:center;gap:8px}
.team-cell .name{font-weight:600}
.team-cell img{width:22px;height:15px;border-radius:2px;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.4);flex-shrink:0}
.team-cell:hover .name{color:#f0a500}
/* calendar filter */
.cal-filter{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem;justify-content:center}
.cal-filter button{padding:4px 14px;border-radius:6px;border:1px solid #2a2d3a;background:#1a1d29;color:#7a7f93;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s}
.cal-filter button:hover{border-color:#f0a500;color:#f0a500}
.cal-filter button.active{background:#f0a500;color:#1a1d29;border-color:#f0a500}
/* calendar cards - grouped by date */
.calendar-list{display:flex;flex-direction:column;gap:0}
.date-sep{font-size:.75rem;font-weight:700;color:#7a7f93;padding:.6rem .25rem .4rem;margin-top:.5rem;border-bottom:1px solid #2a2d3a;text-transform:uppercase;letter-spacing:.5px}
.date-sep:first-child{margin-top:0}
.cal-card{display:flex;flex-direction:column;gap:6px;background:#1a1d29;border:1px solid #2a2d3a;border-radius:12px;padding:.85rem 1rem;margin-top:.6rem;transition:all .15s}
.cal-card:hover{border-color:#f0a50040}
.cal-card .cal-city{font-size:.65rem;font-weight:700;color:#f0a500;text-transform:uppercase;letter-spacing:.5px}
.cal-card .cal-teams{display:flex;align-items:center;justify-content:center;gap:12px}
.cal-card .cal-team{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:color .15s;flex:1}
.cal-card .cal-team:hover{color:#f0a500}
.cal-card .cal-team img{width:38px;height:25px;border-radius:3px;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.cal-card .cal-team .cal-name{font-size:.72rem;font-weight:700;text-align:center;line-height:1.2;max-width:80px}
.cal-card .cal-score{font-size:1rem;font-weight:800;min-width:34px;text-align:center;flex-shrink:0}
.cal-card .cal-bottom{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:.62rem;color:#7a7f93}
.cal-card .cal-bottom span{background:#0f1117;padding:2px 8px;border-radius:4px;white-space:nowrap}
.cal-card .cal-bottom .cal-group{font-weight:700}
/* stadium modal cards (used by buildMatchHtml) */
.match-card{display:flex;align-items:center;gap:.75rem;background:#141720;border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;border:1px solid transparent}
.match-card:last-child{margin-bottom:0}
.match-date{min-width:70px;text-align:center;flex-shrink:0}
.match-date .day{font-size:.72rem;font-weight:700;color:#e4e6eb;white-space:nowrap}
.match-date .time{font-size:.62rem;color:#7a7f93;margin-top:1px}
.match-teams{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.team-inline{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.8rem;cursor:pointer}
.team-inline:hover{color:#f0a500}
.team-inline img{width:20px;height:13px;border-radius:2px;object-fit:cover;flex-shrink:0}
.match-score{font-weight:800;font-size:.95rem;min-width:36px;text-align:center;color:#f0a500}
.match-vs{color:#7a7f93;font-size:.7rem;font-weight:600}
.loading{text-align:center;padding:4rem 2rem;color:#7a7f93}
.loading .spinner{width:40px;height:40px;border:3px solid #2a2d3a;border-top-color:#f0a500;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-final{display:inline-block;background:#27ae60;color:#fff;font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;vertical-align:middle}
.badge-live{display:inline-block;background:#e74c3c;color:#fff;font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;animation:pulse 1.5s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#1a1d29;border:1px solid #2a2d3a;border-radius:14px;max-width:700px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #2a2d3a;font-weight:700;font-size:1.1rem;flex-shrink:0}
.modal-close{background:none;border:none;color:#7a7f93;font-size:1.5rem;cursor:pointer;padding:0;line-height:1}
.modal-close:hover{color:#e4e6eb}
.modal-body{overflow-y:auto;padding:1rem 1.25rem}
.modal-body .match-card{border-color:transparent;background:#141720;margin-bottom:.5rem}
.modal-body .match-card:last-child{margin-bottom:0}
.modal-body .match-date-sep{font-size:.75rem;font-weight:700;color:#7a7f93;padding:.5rem 0;border-bottom:1px solid #2a2d3a;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px}
.leaflet-popup-content-wrapper{background:#1a1d29!important;color:#e4e6eb!important;border-radius:10px!important;border:1px solid #2a2d3a!important;box-shadow:0 4px 20px rgba(0,0,0,.5)!important}
.leaflet-popup-tip{background:#1a1d29!important;border:1px solid #2a2d3a!important}
.leaflet-popup-content{margin:10px 14px!important;font-family:inherit!important}
.stadium-popup+.leaflet-popup .leaflet-popup-close-button{color:#7a7f93!important;font-size:18px!important}
.stadium-pin{background:0 0!important;border:none!important}
.stadium-pin>div{position:relative;display:flex;align-items:center;justify-content:center;background:#f0a500;color:#fff;font-weight:800;font-size:11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.stadium-pin>div>span{transform:rotate(45deg)}
/* spain tab */
.spain-hero{display:flex;align-items:center;gap:1.25rem;background:linear-gradient(135deg,#1a1d29,#0f1117);border:1px solid #2a2d3a;border-radius:14px;padding:1.5rem;margin-bottom:1.25rem}
.spain-hero img{width:64px;height:43px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.spain-hero h2{font-size:1.5rem;font-weight:800}
.spain-hero .spain-meta{display:flex;gap:12px;margin-top:4px;font-size:.8rem;color:#7a7f93}
.spain-hero .spain-meta span{background:#141720;padding:3px 10px;border-radius:6px}
.spain-section{background:#1a1d29;border:1px solid #2a2d3a;border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.spain-section h3{font-size:.85rem;font-weight:700;color:#f0a500;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.5px}
.spain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.75rem}
.spain-stat{background:#141720;border-radius:10px;padding:.75rem;text-align:center}
.spain-stat .num{font-size:1.3rem;font-weight:800;color:#f0a500}
.spain-stat .label{font-size:.65rem;color:#7a7f93;margin-top:2px;text-transform:uppercase}
/* history tab */
.history-section{background:#1a1d29;border:1px solid #2a2d3a;border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.history-section h3{font-size:.85rem;font-weight:700;color:#f0a500;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.5px}
.ranking-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.ranking-bar-item{display:flex;align-items:center;gap:10px}
.ranking-bar-item .pos{font-size:.75rem;font-weight:700;color:#7a7f93;width:20px;text-align:center;flex-shrink:0}
.ranking-bar-item img{width:22px;height:15px;border-radius:2px;object-fit:cover;flex-shrink:0}
.ranking-bar-item .rname{font-size:.8rem;font-weight:600;width:100px;flex-shrink:0}
.ranking-bar-item .bar-wrap{flex:1;height:22px;background:#141720;border-radius:6px;overflow:hidden}
.ranking-bar-item .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:.65rem;font-weight:700;color:#fff;min-width:28px;transition:width .3s}
.timeline{display:flex;flex-direction:column;gap:8px}
.timeline-item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#141720;border-radius:10px;transition:all .15s}
.timeline-item:hover{background:#1a1d29}
.timeline-item .tyear{font-size:.8rem;font-weight:700;color:#f0a500;width:42px;flex-shrink:0}
.timeline-item .tflags{display:flex;align-items:center;gap:4px;flex-shrink:0}
.timeline-item .tflags img{width:26px;height:17px;border-radius:2px;object-fit:cover}
.timeline-item .tvs{font-size:.65rem;color:#7a7f93;font-weight:600;text-align:center}
.timeline-item .tscore{font-size:.85rem;font-weight:800;color:#e4e6eb;min-width:44px;text-align:center}
.timeline-item .thost{font-size:.68rem;color:#7a7f93;margin-left:auto;flex-shrink:0}
.records-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem}
.record-card{background:#141720;border-radius:10px;padding:.85rem;text-align:center;border:1px solid transparent;transition:all .15s}
.record-card:hover{border-color:#f0a50040;transform:translateY(-2px)}
.record-card .r-icon{font-size:1.5rem;margin-bottom:4px}
.record-card .r-value{font-size:1.1rem;font-weight:800;color:#f0a500}
.record-card .r-label{font-size:.65rem;color:#7a7f93;margin-top:2px}
@media(max-width:768px){
  header h1{font-size:1.5rem}
  header p{font-size:.75rem}
  header{padding:1rem 1rem}
  .container{padding:1rem}
  .tab-btn{padding:.6rem .9rem;font-size:.8rem}
  .groups-grid{grid-template-columns:1fr}
  .group-standings{font-size:.72rem}
  .group-standings th,.group-standings td{padding:.35rem .25rem}
  .group-standings th:first-child,.group-standings td:first-child{padding-left:.5rem}
  .team-cell img{width:18px;height:12px}
  .cal-card{padding:.7rem .8rem}
  .cal-card .cal-team img{width:30px;height:20px}
  .cal-card .cal-team .cal-name{font-size:.65rem;max-width:65px}
  .cal-card .cal-score{font-size:.85rem;min-width:28px}
  .modal{padding:0}
  .modal-header{padding:.75rem 1rem;font-size:1rem}
  .modal-body{padding:.75rem 1rem}
}
</style>
</head>
<body>

<header>
  <h1>&#9917; Mundial <span>2026</span></h1>
  <p>Canadá · México · Estados Unidos • 11 Jun – 19 Jul</p>
  <div class="tabs">
    <button class="tab-btn active" data-tab="groups">Grupos</button>
    <button class="tab-btn" data-tab="calendar">Calendario</button>
    <button class="tab-btn" data-tab="spain">España</button>
    <button class="tab-btn" data-tab="history">Historia</button>
    <button class="tab-btn" data-tab="map">Estadios</button>
  </div>
</header>

<div class="container">
  <div id="tab-groups" class="tab-content active">
    <div id="groups-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando grupos…</p>
    </div>
    <div id="groups-content" class="groups-grid"></div>
  </div>

  <div id="tab-calendar" class="tab-content">
    <div id="calendar-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando calendario…</p>
    </div>
    <div id="calendar-filter" class="cal-filter"></div>
    <div id="calendar-content" class="calendar-list"></div>
  </div>

  <div id="tab-history" class="tab-content">
    <div id="history-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando historia…</p>
    </div>
    <div id="history-content"></div>
  </div>

  <div id="tab-map" class="tab-content">
    <div id="map-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando mapa…</p>
    </div>
    <div id="map-container" style="height:75vh;border-radius:12px;overflow:hidden;border:1px solid #2a2d3a"></div>
  </div>

  <div id="tab-spain" class="tab-content">
    <div id="spain-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando información de España…</p>
    </div>
    <div id="spain-content"></div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title"></span>
      <button id="modal-close" class="modal-close">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const API_BASE = '';

const GROUP_COLORS = {
  A:'#E74C3C',B:'#3498DB',C:'#2ECC71',D:'#F39C12',
  E:'#9B59B6',F:'#1ABC9C',G:'#E67E22',H:'#2980B9',
  I:'#27AE60',J:'#8E44AD',K:'#D35400',L:'#C0392B'
};

const state = { teams:[], groups:[], games:[], stadiums:[], interval:null, calendarGroup:'' };

async function fetchJSON(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function loadAll(){
  const [tData,gData,gamesData,sData]=await Promise.all([
    fetchJSON(API_BASE+'data/teams.json'),
    fetchJSON(API_BASE+'data/groups.json'),
    fetchJSON(API_BASE+'data/games.json'),
    fetchJSON(API_BASE+'data/stadiums.json')
  ]);
  state.teams=tData.teams||tData;
  state.groups=gData.groups||gData;
  state.games=gamesData.games||gamesData;
  state.stadiums=sData.stadiums||sData;
}

function getTeam(id){
  return state.teams.find(t=>String(t.id)===String(id));
}

function getStadium(id){
  return state.stadiums.find(s=>String(s.id)===String(id));
}

const SPAIN_OFFSET = {1:8,2:8,3:8,4:7,5:7,6:7,7:6,8:6,9:6,10:6,11:6,12:6,13:9,14:9,15:9,16:9};

function spainTime(localDateStr, stadiumId){
  const off = SPAIN_OFFSET[Number(stadiumId)]||0;
  if(!localDateStr) return {time:'--:--',dayShift:0};
  const p = localDateStr.split(' ');
  const t = (p[1]||'00:00').split(':').map(Number);
  let h = (t[0]||0) + off, m = t[1]||0;
  let dayShift = 0;
  while(h>=24){h-=24;dayShift++}
  while(h<0){h+=24;dayShift--}
  return {time:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'), dayShift};
}

function renderGroups(){
  const el=document.getElementById('groups-content');
  const sorted=[...state.groups].sort((a,b)=>a.name.localeCompare(b.name));
  el.innerHTML=sorted.map(g=>{
    const color=GROUP_COLORS[g.name]||'#666';
    const sortedTeams=[...g.teams].sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
    return `
      <div class="group-card">
        <div class="group-header" style="background:${color};color:#fff">
          <span>Grupo ${g.name}</span>
          <span style="font-size:.75rem;opacity:.8">${g.teams.length} equipos</span>
        </div>
        <div class="table-wrap">
        <table class="group-standings">
          <thead><tr>
            <th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th>
          </tr></thead>
          <tbody>
            ${sortedTeams.map((t,i)=>{
              const team=getTeam(t.team_id);
              const name=team?team.name_en:t.team_id;
              const flag=team?team.flag:'';
              return `<tr>
                <td><div class="team-cell" data-team="${t.team_id}">
                  <span class="rank-num">${i+1}</span>
                  ${flag?`<img src="${flag}" alt="" loading="lazy">`:''}
                  <span class="name">${name}</span>
                </div></td>
                <td>${t.mp}</td>
                <td>${t.w}</td>
                <td>${t.d}</td>
                <td>${t.l}</td>
                <td>${t.gf}</td>
                <td>${t.ga}</td>
                <td>${t.gd}</td>
                <td style="font-weight:700;color:${color}">${t.pts}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
      </div>`;
  }).join('');
  el.querySelectorAll('.team-cell').forEach(c=>c.addEventListener('click',()=>{
    const team=getTeam(c.dataset.team);
    if(team) openTeamModal(team);
  }));
}

function renderGroupFilters(){
  const el=document.getElementById('calendar-filter');
  const letters='ABCDEFGHIJKL';
  el.innerHTML='<button class="active" data-g="">Todos</button>'+
    letters.split('').map(l=>`<button data-g="${l}">Grupo ${l}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      el.querySelector('.active')?.classList.remove('active');
      b.classList.add('active');
      state.calendarGroup=b.dataset.g;
      renderCalendar();
    });
  });
}

function renderCalendar(){
  const el=document.getElementById('calendar-content');
  let filtered=[...state.games].filter(g=>g.finished!=='TRUE'&&g.finished!==true);
  if(state.calendarGroup){
    filtered=filtered.filter(g=>g.group===state.calendarGroup||
      (g.type!=='group'&&g.home_team_name_en&&g.away_team_name_en));
  }
  const sorted=filtered
    .sort((a,b)=>new Date(a.local_date)-new Date(b.local_date)||a.id-b.id);

  const grouped={};
  sorted.forEach(g=>{
    const st=spainTime(g.local_date,g.stadium_id);
    const adjDate=new Date(g.local_date);
    if(st.dayShift) adjDate.setDate(adjDate.getDate()+st.dayShift);
    const key=adjDate.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(g);
  });

  el.innerHTML=Object.entries(grouped).map(([date,games])=>
    `<div class="date-sep">${date.charAt(0).toUpperCase()+date.slice(1)}</div>`+
    games.map(g=>{
      const homeTeam=getTeam(g.home_team_id);
      const awayTeam=getTeam(g.away_team_id);
      const homeId=homeTeam?homeTeam.id:g.home_team_id;
      const awayId=awayTeam?awayTeam.id:g.away_team_id;
      const homeName=g.home_team_name_en||(homeTeam?homeTeam.name_en:'TBD');

function getStadiumMatches(stadiumId) {
  return state.games.filter(g=>String(g.stadium_id)===String(stadiumId))
    .sort((a,b)=>new Date(a.local_date)-new Date(b.local_date)||a.id-b.id);
}

function buildMatchHtml(g){
  const homeTeam=getTeam(g.home_team_id);
  const awayTeam=getTeam(g.away_team_id);
  const homeName=g.home_team_name_en||(homeTeam?homeTeam.name_en:'TBD');
  const awayName=g.away_team_name_en||(awayTeam?awayTeam.name_en:'TBD');
  const homeFlag=homeTeam?homeTeam.flag:'';
  const awayFlag=awayTeam?awayTeam.flag:'';
  const homeId=homeTeam?homeTeam.id:g.home_team_id;
  const awayId=awayTeam?awayTeam.id:g.away_team_id;
  const dt=new Date(g.local_date);
  const dateStr=dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
  const st=spainTime(g.local_date,g.stadium_id);
  const timeStr=st.time+'h'+(st.dayShift?' (+1)':'');
  const isFinished=g.finished==='TRUE'||g.finished===true;
  const isLive=g.time_elapsed&&g.time_elapsed!=='notstarted'&&!isFinished;
  const stadium=getStadium(g.stadium_id);
  const venueStr=stadium?`${stadium.name_en}, ${stadium.city_en}`:'';
  let scoreHtml;
  if(isFinished){
    scoreHtml=`<span class="match-score">${g.home_score??''}-${g.away_score??''}</span> <span class="badge-final">Final</span>`;
  }else if(isLive){
    scoreHtml=`<span class="match-score">${g.home_score??''}-${g.away_score??''}</span> <span class="badge-live">Live</span>`;
  }else{
    scoreHtml=`<span class="match-vs">VS</span>`;
  }
  return `<div class="match-card">
    <div class="match-date">
      <div class="day">${dateStr}</div>
      <div class="time">${timeStr}</div>
      ${venueStr?`<div style="font-size:.55rem;color:#5a5f73;margin-top:2px">${venueStr}</div>`:''}
    </div>
    <div class="match-teams">
      <div class="team-inline" data-team="${homeId}">${homeFlag?`<img src="${homeFlag}" alt="" loading="lazy">`:''}${homeName}</div>
      ${scoreHtml}
      <div class="team-inline" data-team="${awayId}">${awayFlag?`<img src="${awayFlag}" alt="" loading="lazy">`:''}${awayName}</div>
    </div>
  </div>`;
}

function addMarkers(map){
  state.stadiums.forEach(s=>{
    const coords=STADIUM_COORDS[s.id];
    if(!coords) return;
    const matches=getStadiumMatches(s.id);
    const matchCount=matches.length;
    const size=Math.min(16+matchCount,34);
    const m=L.marker(coords,{
      icon:L.divIcon({
        className:'stadium-pin',
        html:`<div style="width:${size}px;height:${size}px;font-size:9px"><span>${matchCount}</span></div>`,
        iconSize:[size,size],
        iconAnchor:[size/2,size*0.85],
        popupAnchor:[0,-size+4]
      })
    }).addTo(map);
    m.bindPopup(`
      <div style="font-weight:700;font-size:.9rem">${s.name_en}</div>
      <div style="font-size:.68rem;color:#aaa;margin-top:1px">${s.city_en}, ${s.country_en}</div>
      <div style="font-size:.7rem;color:#aaa;margin-top:4px"><a href="#" style="color:#f0a500;text-decoration:none;font-weight:700" class="popup-modal-link" data-stadium="${s.id}">${matchCount} partidos &rarr;</a></div>`,
      {className:'stadium-popup',closeButton:false});
  });
}

function initMap(readyOnly){
  if(state._map && readyOnly) return state._map.invalidateSize();
  if(state._map) return;
  state._map=L.map('map-container',{zoomControl:false,attributionControl:true})
    .setView([39.5,-100.5],4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom:18,subdomains:'abcd',attribution:'&copy; <a href="https://carto.com/">CARTO</a>'
  }).addTo(state._map);
  L.control.zoom({position:'bottomright'}).addTo(state._map);
  addMarkers(state._map);
}

function openModal(stadium){
  const matches=getStadiumMatches(stadium.id);
  document.getElementById('modal-title').textContent=`${stadium.name_en} · ${stadium.city_en}`;
  const body=document.getElementById('modal-body');

  const grouped={};
  matches.forEach(m=>{
    const dt=new Date(m.local_date);
    const key=dt.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(m);
  });

  body.innerHTML=Object.entries(grouped).map(([date,games])=>
    `<div class="match-date-sep">${date}</div>`+games.map(g=>buildMatchHtml(g)).join('')
  ).join('');
  body.querySelectorAll('.team-inline[data-team]').forEach(c=>c.addEventListener('click',e=>{
    e.stopPropagation();
    const team=getTeam(c.dataset.team);
    if(team){document.getElementById('modal-overlay').classList.remove('open');setTimeout(()=>openTeamModal(team),200)}
  }));

  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click',()=>{

});
document.getElementById('modal-overlay').addEventListener('click',(e)=>{

function renderSpain(){
  const el=document.getElementById('spain-content');
  const team=state.teams.find(t=>t.name_en==='Spain');
  if(!team){el.innerHTML='<div class="loading"><p>No se encontró información de España</p></div>';return}
  const grpData=state.groups.find(g=>g.name===team.groups);
  const grpColor=GROUP_COLORS[team.groups]||'#666';
  const teamInGroup=grpData?grpData.teams.find(t=>String(t.team_id)===String(team.id)):null;
  const teamGames=state.games.filter(g=>
    String(g.home_team_id)===String(team.id)||String(g.away_team_id)===String(team.id)
  ).sort((a,b)=>new Date(a.local_date)-new Date(b.local_date)||a.id-b.id);
  const wins=teamGames.filter(g=>{
    if(g.finished!=='TRUE'&&g.finished!==true) return false;
    const isHome=String(g.home_team_id)===String(team.id);
    return isHome?Number(g.home_score)>Number(g.away_score):Number(g.away_score)>Number(g.home_score);
  }).length;
  const draws=teamGames.filter(g=>{
    if(g.finished!=='TRUE'&&g.finished!==true) return false;
    return Number(g.home_score)===Number(g.away_score)&&g.home_score!==null;
  }).length;
  const gf=teamGames.reduce((s,g)=>{
    if(g.finished!=='TRUE'&&g.finished!==true) return s;
    return s+(String(g.home_team_id)===String(team.id)?Number(g.home_score||0):Number(g.away_score||0));
  },0);
  const ga=teamGames.reduce((s,g)=>{
    if(g.finished!=='TRUE'&&g.finished!==true) return s;
    return s+(String(g.home_team_id)===String(team.id)?Number(g.away_score||0):Number(g.home_score||0));

const WC_RECORDS = [
  {icon:'🏆',value:'5',label:'Más títulos (Brasil)'},
  {icon:'🇧🇷',value:'22',label:'Más participaciones'},
  {icon:'⚽',value:'16',label:'Goles en un mundial (Mbappé 2022)'},
  {icon:'🥅',value:'7-1',label:'Mayor goleada semifinal (2014)'},
  {icon:'🇩🇪',value:'8',label:'Finales (Alemania)'},
  {icon:'🌍',value:'3',label:'Países anfitriones 2026'}
];

function renderHistory(){
  const el=document.getElementById('history-content');
  const sorted=[...WC_HISTORY].sort((a,b)=>b.y-a.y);
  const titles={};
  WC_HISTORY.forEach(m=>{titles[m.c]=(titles[m.c]||0)+1});
  const rank=Object.entries(titles).sort((a,b)=>b[1]-a[1]);
  const maxTitles=rank[0][1];
  const titleColors={Brazil:'#009739',Germany:'#DD0000',Italy:'#008FD7',Argentina:'#75AADB',France:'#002395',Uruguay:'#0038A8',England:'#C8102E',Spain:'#C60B1E'};

  el.innerHTML=`
    <div class="history-section">
      <h3>Ranking de t&iacute;tulos</h3>
      <div class="ranking-bar">
        ${rank.map(([country,count],i)=>{
          const pct=Math.max(count/maxTitles*100,15);
          const color=titleColors[country]||'#f0a500';
          const code={Uruguay:'uy',England:'gb-eng','West Germany':'de',Germany:'de',Italy:'it',Brazil:'br',Argentina:'ar',France:'fr',Spain:'es'}[country]||country.toLowerCase().slice(0,2);
          return `<div class="ranking-bar-item">
            <span class="pos">${i+1}</span>
            <img src="https://flagcdn.com/w40/${code}.png" alt="" loading="lazy">
            <span class="rname">${country}</span>
            <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${color}">${count}</div></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="history-section">
      <h3>R&eacute;cords</h3>
      <div class="records-grid">
        ${WC_RECORDS.map(r=>`<div class="record-card">
          <div class="r-icon">${r.icon}</div>
          <div class="r-value">${r.value}</div>
          <div class="r-label">${r.label}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="history-section">
      <h3>Todos los campeones</h3>
      <div class="timeline">
        ${sorted.map(m=>{
          const cFlag=`https://flagcdn.com/w40/${m.cf}.png`;
          const rFlag=`https://flagcdn.com/w40/${m.rf}.png`;
          const cColor=titleColors[m.c]||'#f0a500';
          return `<div class="timeline-item" style="border-left:3px solid ${cColor}">
            <span class="tyear">${m.y}</span>
            <div class="tflags"><img src="${cFlag}" alt="" loading="lazy"></div>
            <div style="font-size:.8rem;font-weight:700;min-width:60px">${m.c}</div>
            <div class="tscore">${m.s}</div>
            <div class="tflags"><img src="${rFlag}" alt="" loading="lazy"></div>
            <div style="font-size:.72rem;color:#7a7f93;min-width:60px">${m.r}</div>
            <span class="thost">${m.h}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

document.querySelector('[data-tab="map"]').addEventListener('click',()=>{
  const tryInit=()=>{
    if(!state.stadiums||!state.stadiums.length){setTimeout(tryInit,100);return}
    initMap();
    setTimeout(()=>{
      if(state._map) state._map.invalidateSize();
      document.getElementById('map-loading').style.display='none';
    },300);
  };
  setTimeout(tryInit,200);
});
// init spain when tab is first shown
document.querySelector('[data-tab="spain"]').addEventListener('click',()=>{
  setTimeout(()=>document.getElementById('spain-loading').style.display='none',100);
});
</script>
