<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0f1117;color:#e4e6eb;min-height:100vh}
header{background:linear-gradient(135deg,#1a1d29,#0f1117);border-bottom:2px solid #2a2d3a;padding:1.5rem 2rem;text-align:center;position:sticky;top:0;z-index:100}
header h1{font-size:2rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#f7c948,#f0a500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header h1 span{font-weight:300;-webkit-text-fill-color:#e4e6eb}
header p{color:#7a7f93;font-size:.85rem;margin-top:4px}
.tabs{display:flex;justify-content:center;gap:0;margin-top:1rem;border-bottom:1px solid #2a2d3a}
.tab-btn{background:transparent;border:none;color:#7a7f93;padding:.75rem 2rem;font-size:.95rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn:hover{color:#e4e6eb}
.tab-btn.active{color:#f0a500;border-bottom-color:#f0a500}
.container{max-width:1400px;margin:0 auto;padding:1.5rem}
.tab-content{display:none}
.tab-content.active{display:block}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}
.group-card{border-radius:12px;overflow:hidden;background:#1a1d29;border:1px solid #2a2d3a;transition:transform .15s}
.group-card:hover{transform:translateY(-2px)}
.group-header{padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:1.1rem;letter-spacing:1px}
.group-standings{width:100%;border-collapse:collapse;font-size:.82rem}
.group-standings th{padding:.5rem .4rem;text-align:center;font-size:.7rem;text-transform:uppercase;color:#7a7f93;font-weight:600;border-bottom:1px solid #2a2d3a;background:#141720}
.group-standings th:first-child{text-align:left;padding-left:.75rem}
.group-standings td{padding:.5rem .4rem;text-align:center;border-bottom:1px solid #2a2d3a;white-space:nowrap}
.group-standings tr:last-child td{border-bottom:none}
.group-standings td:first-child{text-align:left;padding-left:.75rem}
.rank-num{display:inline-block;width:18px;text-align:center;font-weight:700;font-size:.75rem;color:#7a7f93}
.team-cell{display:flex;align-items:center;gap:8px}
.team-cell .name{font-weight:600}
.team-cell img{width:22px;height:15px;border-radius:2px;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.4);flex-shrink:0}
.group-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.calendar-list{display:flex;flex-direction:column;gap:.75rem}
.match-card{display:flex;align-items:center;gap:1rem;background:#1a1d29;border:1px solid #2a2d3a;border-radius:10px;padding:1rem 1.25rem;transition:transform .15s}
.match-card:hover{transform:translateX(3px)}
.match-date{min-width:90px;text-align:center}
.match-date .day{font-size:.85rem;font-weight:700;color:#e4e6eb}
.match-date .time{font-size:.75rem;color:#7a7f93}
.match-teams{flex:1;display:flex;align-items:center;justify-content:center;gap:1rem}
.team-inline{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.team-inline img{width:24px;height:16px;border-radius:2px;object-fit:cover;flex-shrink:0}
.match-score{font-weight:800;font-size:1.1rem;min-width:50px;text-align:center;color:#f0a500}
.match-vs{color:#7a7f93;font-size:.8rem;font-weight:600}
.match-info{min-width:180px;text-align:right;font-size:.78rem;color:#7a7f93}
.match-info .venue{display:block}
.match-group-label{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.65rem;font-weight:700;letter-spacing:.5px;margin-top:3px}
.loading{text-align:center;padding:4rem 2rem;color:#7a7f93}
.loading .spinner{width:40px;height:40px;border:3px solid #2a2d3a;border-top-color:#f0a500;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-final{display:inline-block;background:#27ae60;color:#fff;font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;vertical-align:middle}
.badge-live{display:inline-block;background:#e74c3c;color:#fff;font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;animation:pulse 1.5s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#1a1d29;border:1px solid #2a2d3a;border-radius:14px;max-width:700px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #2a2d3a;font-weight:700;font-size:1.1rem;flex-shrink:0}
.modal-close{background:none;border:none;color:#7a7f93;font-size:1.5rem;cursor:pointer;padding:0;line-height:1}
.modal-close:hover{color:#e4e6eb}
.modal-body{overflow-y:auto;padding:1rem 1.25rem}
.modal-body .match-card{border-color:transparent;background:#141720;margin-bottom:.5rem}
.modal-body .match-card:last-child{margin-bottom:0}
.modal-body .match-date-sep{font-size:.75rem;font-weight:700;color:#7a7f93;padding:.5rem 0;border-bottom:1px solid #2a2d3a;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px}
.leaflet-popup-content-wrapper{background:#1a1d29!important;color:#e4e6eb!important;border-radius:10px!important;border:1px solid #2a2d3a!important;box-shadow:0 4px 20px rgba(0,0,0,.5)!important}
.leaflet-popup-tip{background:#1a1d29!important;border:1px solid #2a2d3a!important}
.leaflet-popup-content{margin:10px 14px!important;font-family:inherit!important}
.stadium-popup+.leaflet-popup .leaflet-popup-close-button{color:#7a7f93!important;font-size:18px!important}
@media(max-width:768px){
  header h1{font-size:1.5rem}
  .container{padding:1rem}
  .groups-grid{grid-template-columns:1fr}
  .match-card{flex-wrap:wrap;gap:.5rem;padding:.75rem 1rem}
  .match-teams{width:100%;justify-content:space-between}
  .match-date{min-width:70px}
  .match-info{min-width:auto;text-align:left;width:100%}
  .team-inline{font-size:.8rem}
  .team-inline img{width:20px;height:13px}
}
</style>
</head>
<body>

<header>
  <h1>&#9917; Mundial <span>2026</span></h1>
  <p>Canadá · México · Estados Unidos • 11 Jun – 19 Jul</p>
  <div class="tabs">
    <button class="tab-btn active" data-tab="groups">Grupos</button>
    <button class="tab-btn" data-tab="calendar">Calendario</button>
    <button class="tab-btn" data-tab="map">Estadios</button>
  </div>
</header>

<div class="container">
  <div id="tab-groups" class="tab-content active">
    <div id="groups-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando grupos…</p>
    </div>
    <div id="groups-content" class="groups-grid"></div>
  </div>

  <div id="tab-calendar" class="tab-content">
    <div id="calendar-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando calendario…</p>
    </div>
    <div id="calendar-content" class="calendar-list"></div>
  </div>

  <div id="tab-map" class="tab-content">
    <div id="map-loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando mapa…</p>
    </div>
    <div id="map-container" style="height:75vh;border-radius:12px;overflow:hidden;border:1px solid #2a2d3a"></div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title"></span>
      <button id="modal-close" class="modal-close">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const API_BASE = '';

const GROUP_COLORS = {
  A:'#E74C3C',B:'#3498DB',C:'#2ECC71',D:'#F39C12',
  E:'#9B59B6',F:'#1ABC9C',G:'#E67E22',H:'#2980B9',
  I:'#27AE60',J:'#8E44AD',K:'#D35400',L:'#C0392B'
};

const state = { teams:[], groups:[], games:[], stadiums:[], interval:null };

async function fetchJSON(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function loadAll(){
  const [tData,gData,gamesData,sData]=await Promise.all([
    fetchJSON(API_BASE+'data/teams.json'),
    fetchJSON(API_BASE+'data/groups.json'),
    fetchJSON(API_BASE+'data/games.json'),
    fetchJSON(API_BASE+'data/stadiums.json')
  ]);
  state.teams=tData.teams||tData;
  state.groups=gData.groups||gData;
  state.games=gamesData.games||gamesData;
  state.stadiums=sData.stadiums||sData;
}

function getTeam(id){
  return state.teams.find(t=>String(t.id)===String(id));
}

function getStadium(id){
  return state.stadiums.find(s=>String(s.id)===String(id));
}

function renderGroups(){
  const el=document.getElementById('groups-content');
  const sorted=[...state.groups].sort((a,b)=>a.name.localeCompare(b.name));
  el.innerHTML=sorted.map(g=>{
    const color=GROUP_COLORS[g.name]||'#666';
    const sortedTeams=[...g.teams].sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
    return `
      <div class="group-card">
        <div class="group-header" style="background:${color};color:#fff">
          <span>Grupo ${g.name}</span>
          <span style="font-size:.75rem;opacity:.8">${g.teams.length} equipos</span>
        </div>
        <table class="group-standings">
          <thead><tr>
            <th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th>
          </tr></thead>
          <tbody>
            ${sortedTeams.map((t,i)=>{
              const team=getTeam(t.team_id);
              const name=team?team.name_en:t.team_id;
              const flag=team?team.flag:'';
              return `<tr>
                <td><div class="team-cell">
                  <span class="rank-num">${i+1}</span>
                  <span class="group-dot" style="background:${color}"></span>
                  ${flag?`<img src="${flag}" alt="" loading="lazy">`:''}
                  <span class="name">${name}</span>
                </div></td>
                <td>${t.mp}</td>
                <td>${t.w}</td>
                <td>${t.d}</td>
                <td>${t.l}</td>
                <td>${t.gf}</td>
                <td>${t.ga}</td>
                <td>${t.gd}</td>
                <td style="font-weight:700;color:${color}">${t.pts}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }).join('');
}

function renderCalendar(){
  const el=document.getElementById('calendar-content');
  const sorted=[...state.games]
    .sort((a,b)=>new Date(a.local_date)-new Date(b.local_date)||a.id-b.id);

  el.innerHTML=sorted.map(g=>{
    const homeTeam=getTeam(g.home_team_id);
    const awayTeam=getTeam(g.away_team_id);
    const homeName=g.home_team_name_en||(homeTeam?homeTeam.name_en:'TBD');
    const awayName=g.away_team_name_en||(awayTeam?awayTeam.name_en:'TBD');
    const homeFlag=homeTeam?homeTeam.flag:'';
    const awayFlag=awayTeam?awayTeam.flag:'';
    const stadium=getStadium(g.stadium_id);
    const venueStr=stadium?`${stadium.name_en}, ${stadium.city_en}`:'';
    const dt=new Date(g.local_date);
    const dateStr=dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
    const timeStr=dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false});
    const isFinished=g.finished==='TRUE'||g.finished===true;
    const isLive=g.time_elapsed&&g.time_elapsed!=='notstarted'&&!isFinished;

    let scoreHtml;
    if(isFinished){
      const hs=String(g.home_score??'');
      const as=String(g.away_score??'');
      scoreHtml=`<span class="match-score">${hs}-${as}</span> <span class="badge-final">Final</span>`;
    }else if(isLive){
      const hs=String(g.home_score??'');
      const as=String(g.away_score??'');
      scoreHtml=`<span class="match-score">${hs}-${as}</span> <span class="badge-live">Live</span>`;
    }else{
      scoreHtml=`<span class="match-vs">VS</span>`;
    }

    const group=g.group||'';
    const typeLabels={group:`Grupo ${group}`,r32:'Ronda de 32',r16:'Octavos',qf:'Cuartos',sf:'Semifinal',third:'3er Puesto',final:'Final'};
    const groupLabel=typeLabels[g.type]||group;
    const grpColor=GROUP_COLORS[group]||'#666';

    return `<div class="match-card">
      <div class="match-date">
        <div class="day">${dateStr}</div>
        <div class="time">${timeStr}</div>
      </div>
      <div class="match-teams">
        <div class="team-inline">${homeFlag?`<img src="${homeFlag}" alt="" loading="lazy">`:''}${homeName}</div>
        ${scoreHtml}
        <div class="team-inline">${awayFlag?`<img src="${awayFlag}" alt="" loading="lazy">`:''}${awayName}</div>
      </div>
      <div class="match-info">
        ${venueStr?`<span class="venue">${venueStr}</span>`:''}
        <span class="match-group-label" style="background:${grpColor}20;color:${grpColor};border:1px solid ${grpColor}40">${groupLabel}</span>
      </div>
    </div>`;
  }).join('');
}

async function refresh(){
  try{
    await loadAll();
    renderGroups();
    renderCalendar();
    document.getElementById('groups-loading').style.display='none';
    document.getElementById('calendar-loading').style.display='none';
  }catch(e){
    console.error('Error al cargar datos:', e);
  }
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

refresh();
state.interval=setInterval(refresh,60000);

// --- Stadiums Map ---
const STADIUM_COORDS = {
  1:[19.3029,-99.1504],2:[20.6817,-103.4625],3:[25.6701,-100.2438],
  4:[32.7473,-97.0927],5:[29.6847,-95.4107],6:[39.0489,-94.4839],
  7:[33.7555,-84.4008],8:[25.9580,-80.2389],9:[41.9297,-71.2950],
  10:[39.9008,-75.1675],11:[40.8128,-74.0742],12:[43.6328,-79.4186],
  13:[49.2761,-123.1119],14:[47.5951,-122.3316],15:[37.4033,-121.9700],
  16:[33.9533,-118.3388]
};

function getStadiumMatches(stadiumId) {
  return state.games.filter(g=>String(g.stadium_id)===String(stadiumId))
    .sort((a,b)=>new Date(a.local_date)-new Date(b.local_date)||a.id-b.id);
}

function buildMatchHtml(g){
  const homeTeam=getTeam(g.home_team_id);
  const awayTeam=getTeam(g.away_team_id);
  const homeName=g.home_team_name_en||(homeTeam?homeTeam.name_en:'TBD');
  const awayName=g.away_team_name_en||(awayTeam?awayTeam.name_en:'TBD');
  const homeFlag=homeTeam?homeTeam.flag:'';
  const awayFlag=awayTeam?awayTeam.flag:'';
  const dt=new Date(g.local_date);
  const dateStr=dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
  const timeStr=dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false});
  const isFinished=g.finished==='TRUE'||g.finished===true;
  const isLive=g.time_elapsed&&g.time_elapsed!=='notstarted'&&!isFinished;
  let scoreHtml;
  if(isFinished){
    scoreHtml=`<span class="match-score">${g.home_score??''}-${g.away_score??''}</span> <span class="badge-final">Final</span>`;
  }else if(isLive){
    scoreHtml=`<span class="match-score">${g.home_score??''}-${g.away_score??''}</span> <span class="badge-live">Live</span>`;
  }else{
    scoreHtml=`<span class="match-vs">VS</span>`;
  }
  const group=g.group||'';
  const typeLabels={group:`Grupo ${group}`,r32:'Ronda de 32',r16:'Octavos',qf:'Cuartos',sf:'Semifinal',third:'3er Puesto',final:'Final'};
  const groupLabel=typeLabels[g.type]||group;
  return `<div class="match-card">
    <div class="match-date">
      <div class="day">${dateStr}</div>
      <div class="time">${timeStr}</div>
    </div>
    <div class="match-teams">
      <div class="team-inline">${homeFlag?`<img src="${homeFlag}" alt="" loading="lazy">`:''}${homeName}</div>
      ${scoreHtml}
      <div class="team-inline">${awayFlag?`<img src="${awayFlag}" alt="" loading="lazy">`:''}${awayName}</div>
    </div>
  </div>`;
}

function addMarkers(map){
  state.stadiums.forEach(s=>{
    const coords=STADIUM_COORDS[s.id];
    if(!coords) return;
    const matches=getStadiumMatches(s.id);
    const matchCount=matches.length;
    const w=Math.min(26+matchCount*2,44);
    const h=Math.round(w*1.45);
    const label=matchCount>9?'9+':matchCount;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 24 34">
      <defs>
        <filter id="s${s.id}" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="%23000" flood-opacity=".6"/>
        </filter>
      </defs>
      <path d="M12 1C5.9 1 1 5.9 1 12c0 8.3 11 21 11 21s11-12.7 11-21C23 5.9 18.1 1 12 1z" fill="%23fff" stroke="%23f0a500" stroke-width="2" filter="url(#s${s.id})"/>
      <circle cx="12" cy="12" r="7" fill="%23f0a500"/>
    </svg>`;
    const iconUrl='data:image/svg+xml,'+encodeURIComponent(svg);
    const m=L.marker(coords,{
      icon:L.icon({iconUrl,iconSize:[w,h],iconAnchor:[w/2,h],popupAnchor:[0,-h+8]})
    }).addTo(map);
    m.bindPopup(`
      <div style="font-weight:700;font-size:1rem">${s.name_en}</div>
      <div style="font-size:.8rem;color:#888">${s.city_en}, ${s.country_en} &middot; ${s.capacity.toLocaleString()} asientos</div>
      <div style="font-size:.8rem;color:#f0a500;cursor:pointer;text-decoration:underline" class="modal-trigger">${matchCount} partidos &rarr;</div>`,
      {className:'stadium-popup',closeButton:false});
    m.on('click',()=>openModal(s));
  });
}

function initMap(readyOnly){
  if(state._map && readyOnly) return state._map.invalidateSize();
  if(state._map) return;
  state._map=L.map('map-container',{zoomControl:false,attributionControl:true})
    .setView([39.5,-100.5],4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom:18,subdomains:'abcd',attribution:'&copy; <a href="https://carto.com/">CARTO</a>'
  }).addTo(state._map);
  L.control.zoom({position:'bottomright'}).addTo(state._map);
  addMarkers(state._map);
}

function openModal(stadium){
  const matches=getStadiumMatches(stadium.id);
  document.getElementById('modal-title').textContent=`${stadium.name_en} · ${stadium.city_en}`;
  const body=document.getElementById('modal-body');

  const grouped={};
  matches.forEach(m=>{
    const dt=new Date(m.local_date);
    const key=dt.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(m);
  });

  body.innerHTML=Object.entries(grouped).map(([date,games])=>
    `<div class="match-date-sep">${date}</div>`+games.map(g=>buildMatchHtml(g)).join('')
  ).join('');

  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click',()=>{
  document.getElementById('modal-overlay').classList.remove('open');
});
document.getElementById('modal-overlay').addEventListener('click',(e)=>{
  if(e.target===e.currentTarget) document.getElementById('modal-overlay').classList.remove('open');
});

// init map when tab is first shown
document.querySelector('[data-tab="map"]').addEventListener('click',()=>{
  const tryInit=()=>{
    if(!state.stadiums||!state.stadiums.length){setTimeout(tryInit,100);return}
    initMap();
    setTimeout(()=>{
      if(state._map) state._map.invalidateSize();
      document.getElementById('map-loading').style.display='none';
    },300);
  };
  setTimeout(tryInit,200);
});
</script>

</body>
</html>
